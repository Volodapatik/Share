<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR-Bridge — оптична передача файлів</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <h1>QR-Bridge</h1>
  <div class="mode-switch" role="tablist">
    <button id="tabSender" class="mode-btn active" role="tab">📤 Відправник</button>
    <button id="tabReceiver" class="mode-btn" role="tab">📥 Отримувач</button>
  </div>
</header>

<section id="panelSender" class="panel active">
  <div class="card">
    <label class="file-picker">
      <input type="file" id="fileInput" hidden>
      <span id="fileLabel">Обрати файл для передачі…</span>
    </label>

    <div class="settings-row">
      <label>Розмір блоку
        <select id="blockSizeSel">
          <option value="80">80 B (надійно)</option>
          <option value="120" selected>120 B (баланс)</option>
          <option value="180">180 B (швидко)</option>
          <option value="260">260 B (максимум)</option>
        </select>
      </label>
      <label>FPS кадрів
        <select id="fpsSel">
          <option value="10">10</option>
          <option value="15" selected>15</option>
          <option value="24">24</option>
          <option value="30">30</option>
          <option value="60">60</option>
        </select>
      </label>
    </div>

    <div class="qr-wrap">
      <canvas id="qrCanvas" width="300" height="300"></canvas>
    </div>

    <div class="controls">
      <button id="btnStartSend" class="btn primary" disabled>▶ Почати трансляцію</button>
      <button id="btnStopSend" class="btn danger" disabled>■ Стоп</button>
    </div>
  </div>

  <div class="stats-bar" id="statsSender">
    <div class="stat"><span class="stat-val" id="sFps">0</span><span class="stat-lbl">FPS</span></div>
    <div class="stat"><span class="stat-val" id="sGoodput">0</span><span class="stat-lbl">КБ/с</span></div>
    <div class="stat"><span class="stat-val" id="sProgress">0%</span><span class="stat-lbl">Прогрес</span></div>
    <div class="stat"><span class="stat-val" id="sTimer">00:00</span><span class="stat-lbl">Час</span></div>
  </div>
  <div class="progress-outer"><div class="progress-inner" id="sProgressBar"></div></div>
  <p class="hint" id="sHint">Оберіть файл, щоб почати.</p>
</section>

<section id="panelReceiver" class="panel">
  <div class="card">
    <div class="video-wrap">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="scanOverlay"></canvas>
      <div id="lockBadge" class="lock-badge lost">НЕМАЄ СИГНАЛУ</div>
    </div>

    <div class="controls">
      <button id="btnStartScan" class="btn primary">▶ Увімкнути камеру</button>
      <button id="btnStopScan" class="btn danger" disabled>■ Стоп</button>
      <button id="btnResetRecv" class="btn secondary">↺ Скинути</button>
    </div>
  </div>

  <div class="stats-bar" id="statsReceiver">
    <div class="stat"><span class="stat-val" id="rFps">0</span><span class="stat-lbl">FPS</span></div>
    <div class="stat"><span class="stat-val" id="rGoodput">0</span><span class="stat-lbl">КБ/с</span></div>
    <div class="stat"><span class="stat-val" id="rProgress">0%</span><span class="stat-lbl">Прогрес</span></div>
    <div class="stat"><span class="stat-val" id="rTimer">00:00</span><span class="stat-lbl">Час</span></div>
  </div>
  <div class="progress-outer"><div class="progress-inner" id="rProgressBar"></div></div>
  <p class="hint" id="rHint">Наведіть камеру на екран відправника.</p>
</section>

<canvas id="captureCanvas" hidden></canvas>

<div id="errBanner" class="err-banner" hidden>
  <div id="errText"></div>
  <button id="errClose">✕</button>
</div>

<script>
(function () {
  function loadScript(url) {
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = url;
      s.onload = () => resolve(url);
      s.onerror = () => reject(new Error("Не вдалося завантажити: " + url));
      document.head.appendChild(s);
    });
  }
  async function loadWithFallback(name, mirrors) {
    let lastErr;
    for (const url of mirrors) {
      try {
        await loadScript(url);
        console.log(name + " OK from " + url);
        return;
      } catch (e) {
        lastErr = e;
        console.warn(e.message);
      }
    }
    throw lastErr || new Error("Не вдалося завантажити " + name);
  }
  function showFatal(msg) {
    const b = document.getElementById("errBanner");
    document.getElementById("errText").textContent = msg;
    b.hidden = false;
  }
  (async () => {
    try {
      await loadWithFallback("qrcode", [
        "https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js",
        "https://fastly.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js",
        "https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js",
        "https://unpkg.com/qrcode@1.5.1/build/qrcode.min.js"
      ]);
      if (typeof QRCode === "undefined" || typeof QRCode.toCanvas !== "function") {
        throw new Error("QRCode.toCanvas недоступний");
      }
      await loadWithFallback("jsQR", [
        "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js",
        "https://fastly.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js",
        "https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"
      ]);
      if (typeof jsQR === "undefined") {
        throw new Error("jsQR недоступний");
      }
      await loadScript("app.js");
    } catch (e) {
      showFatal("⚠ " + e.message);
      console.error(e);
    }
  })();

  window.addEventListener("error", (e) => showFatal("⚠ Помилка: " + e.message));
  window.addEventListener("unhandledrejection", (e) => showFatal("⚠ Помилка: " + (e.reason && e.reason.message || e.reason)));
  document.getElementById("errClose").onclick = () => { document.getElementById("errBanner").hidden = true; };
})();
</script>
</body>
</html>
