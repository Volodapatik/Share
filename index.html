<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Share — швидка передача файлів</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <header>
    <h1>Share</h1>
    <p class="subtitle">Швидка P2P передача файлів</p>
  </header>

  <!-- HOME -->
  <section id="home" class="screen active">
    <button id="btnCreate" class="btn primary big">📤 Створити кімнату</button>
    <div class="or">або</div>
    <div class="join-box">
      <input id="joinCode" type="text" placeholder="Код кімнати" maxlength="20" autocomplete="off">
      <button id="btnJoin" class="btn secondary">📥 Приєднатися</button>
    </div>
    <p class="hint">Один QR — і файл летить по Wi-Fi</p>
  </section>

  <!-- SENDER -->
  <section id="sender" class="screen">
    <div class="card">
      <div class="status" id="sStatus">Створення кімнати…</div>
      <div class="code-box" id="roomCode">—</div>
      <div class="qr-wrap">
        <canvas id="qrCanvas" width="240" height="240"></canvas>
      </div>
      <p class="hint">Нехай отримувач відсканує QR або введе код</p>

      <div id="fileArea" class="hidden">
        <label class="file-picker">
          <input type="file" id="fileInput" hidden>
          <span id="fileLabel">Обрати файл</span>
        </label>
        <button id="btnSend" class="btn primary" disabled>▶ Надіслати</button>
      </div>

      <div id="transferArea" class="hidden">
        <div class="progress-label">
          <span id="sFileName">—</span>
          <span id="sPct">0%</span>
        </div>
        <div class="progress-outer"><div class="progress-inner" id="sBar"></div></div>
        <div class="stats">
          <span id="sSpeed">0 КБ/с</span>
          <span id="sDone">0 / 0</span>
        </div>
        <button id="btnCancelSend" class="btn danger">Скасувати</button>
      </div>
    </div>
    <button id="btnBackSender" class="btn ghost">← Назад</button>
  </section>

  <!-- RECEIVER -->
  <section id="receiver" class="screen">
    <div class="card">
      <div class="status" id="rStatus">Підключення…</div>

      <div id="waitArea">
        <div class="spinner"></div>
        <p class="hint">Чекаємо файл від відправника…</p>
      </div>

      <div id="recvTransfer" class="hidden">
        <div class="progress-label">
          <span id="rFileName">—</span>
          <span id="rPct">0%</span>
        </div>
        <div class="progress-outer"><div class="progress-inner" id="rBar"></div></div>
        <div class="stats">
          <span id="rSpeed">0 КБ/с</span>
          <span id="rDone">0 / 0</span>
        </div>
      </div>

      <div id="doneArea" class="hidden">
        <div class="success">✅ Файл отримано!</div>
        <p id="doneName"></p>
        <a id="downloadLink" class="btn primary" download>Завантажити</a>
      </div>
    </div>
    <button id="btnBackReceiver" class="btn ghost">← Назад</button>
  </section>
</div>

<div id="toast" class="toast hidden"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
